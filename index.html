<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New World Quest Map</title>
    <meta name="description" content="Interactive quest map for New World — planner & tracker for quests, achievements and routes." />

    <!-- Open Graph (for Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="New World Quest Map" />
    <meta property="og:title" content="New World Quest Map" />
    <meta property="og:description" content="Interactive quest map for New World — planner & tracker for quests, achievements and routes." />
    <meta property="og:url" content="https://mrmojitoo.github.io/nw-quest-map/" />
    <!-- Preview image (logo) -->
    <meta property="og:image" content="https://mrmojitoo.github.io/nw-quest-map/logo-nwqm.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="New World Quest Map logo" />
    <!-- Optional: set to your actual logo size if you know it -->
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="New World Quest Map" />
    <meta name="twitter:description" content="Interactive quest map for New World — planner & tracker for quests, achievements and routes." />
    <meta name="twitter:image" content="https://mrmojitoo.github.io/nw-quest-map/logo-nwqm.png" />

    <!-- Favicon + base path pour GH Pages -->
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <base href="%BASE_URL%">
    <link rel="icon" type="image/png" href="%BASE_URL%logo-nwqm.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo-nwqm.png" />    
    <style>
      html, body, #root { height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
